# Dump every quarantined extraction row (error detail included) as an
# artifact, for failure-class analysis. Read-only.
name: quarantine-dump
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: dump
        env:
          DSN: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
        run: |
          psql "$DSN" -P pager=off -t -A -c "
            SELECT row_to_json(t) FROM (
              SELECT e.document_hash, e.model, e.prompt_version,
                     e.validator_version, e.updated_at, a.outcome, a.error_detail
              FROM jobhunter.extractions e
              LEFT JOIN LATERAL (
                SELECT outcome, error_detail
                FROM jobhunter.extraction_attempts a
                WHERE a.document_hash = e.document_hash
                  AND a.error_detail IS NOT NULL
                ORDER BY a.started_at DESC LIMIT 1
              ) a ON true
              WHERE e.status = 'quarantined'
              ORDER BY e.updated_at DESC
            ) t;" > quarantined.jsonl
          wc -l quarantined.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quarantined-${{ github.run_id }}
          path: quarantined.jsonl
          retention-days: 3
