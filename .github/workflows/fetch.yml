name: fetch
on:
  schedule:
    # :17 dodges top-of-hour congestion, when GitHub delays or drops scheduled runs
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      extract_max_docs:
        description: "Documents to extract this run (0 skips extraction)"
        required: false
        default: ""

concurrency:
  group: fetch
  cancel-in-progress: false
permissions:
  contents: read
  actions: write # keepalive: re-enable this workflow so the 60-day idle rule cannot silence it
defaults:
  run:
    shell: bash # GitHub runs explicit bash as `bash -eo pipefail`; the unspecified default has no pipefail
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain). Tag shown for humans.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      # Secrets are scoped to the steps that need them, never job-wide.
      # Drain manifests a previous run archived but could not ingest BEFORE fetching, so
      # the watermark never advances past them. Exits 2 on gap manifests (rebuild needed).
      - name: ingest pending
        env:
          JOB_HUNTER_ARCHIVE_URL: ${{ vars.JOB_HUNTER_ARCHIVE_URL }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
        run: uv run job-hunter ingest
      - name: fetch
        env:
          JOB_HUNTER_ARCHIVE_URL: ${{ vars.JOB_HUNTER_ARCHIVE_URL }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
        run: uv run job-hunter fetch --json | tee summary.json
      # L2 extraction: a STEP here, not a second cron — a separate schedule is a
      # second thing that can die silently (durability doc §1). It takes its own
      # advisory lock (job2), so it can never collide with ingestion's.
      # continue-on-error: collection is irreplaceable and extraction is
      # recomputable, so a bad engine day must never fail the run that guards
      # history. Failures stay visible in this step and in `status` below.
      - name: extract
        continue-on-error: true
        timeout-minutes: 30
        env:
          JOB_HUNTER_ARCHIVE_URL: ${{ vars.JOB_HUNTER_ARCHIVE_URL }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
          JOB_HUNTER_L2_ENGINE: openai-compat
          JOB_HUNTER_L2_BASE_URL: ${{ vars.JOB_HUNTER_L2_BASE_URL || 'https://openrouter.ai/api/v1' }}
          JOB_HUNTER_L2_API_KEY: ${{ secrets.JOB_HUNTER_L2_API_KEY }}
          JOB_HUNTER_L2_MODEL_CANDIDATES: ${{ vars.JOB_HUNTER_L2_MODEL_CANDIDATES || 'z-ai/glm-5.2:free' }}
          JOB_HUNTER_L2_MODELS: ${{ vars.JOB_HUNTER_L2_MODELS || 'z-ai/*' }}
          # free tiers cap daily requests and the ladder can spend 3 calls per
          # document, so the default stays well under 1,000 req/day
          JOB_HUNTER_L2_MAX_DOCS: ${{ github.event.inputs.extract_max_docs || vars.JOB_HUNTER_L2_MAX_DOCS || '50' }}
          JOB_HUNTER_L2_MAX_USD: ${{ vars.JOB_HUNTER_L2_MAX_USD || '0' }}
        run: |
          # guards are runtime, not `if:` — the secrets context is not reliably
          # available in a step-level condition, and an unset key must no-op
          # rather than fail the run that guards collection
          if [ -z "${JOB_HUNTER_L2_API_KEY}" ]; then
            echo "extraction skipped: no JOB_HUNTER_L2_API_KEY secret set"; exit 0
          fi
          if [ "${JOB_HUNTER_L2_MAX_DOCS}" = "0" ]; then
            echo "extraction skipped: max_docs=0"; exit 0
          fi
          uv run job-hunter extract run --json | tee extract-summary.json
      - name: status
        if: always()
        env:
          JOB_HUNTER_ARCHIVE_URL: ${{ vars.JOB_HUNTER_ARCHIVE_URL }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
        run: uv run job-hunter status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fetch-summary-${{ github.run_id }}
          path: |
            summary.json
            extract-summary.json
          retention-days: 30
          if-no-files-found: warn
      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling via the API resets that clock; first-party gh, no third-party action.
      - name: keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable fetch.yml --repo "$GITHUB_REPOSITORY"
