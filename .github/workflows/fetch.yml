name: fetch
# Collection-only since 2026-09-11 (owner instruction): archive ATS payloads
# to R2 and advance the Neon store — never L2. Extraction runs locally
# (docs/runbooks/2026-09-09-local-codex-drain.md); the archive is truth and
# extraction is recomputable from it at any time.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: fetch
  cancel-in-progress: false
permissions:
  contents: read
  actions: write # keepalive: re-enable this workflow so the 60-day idle rule cannot silence it
defaults:
  run:
    shell: bash # GitHub runs explicit bash as `bash -eo pipefail`; the unspecified default has no pipefail
jobs:
  fetch:
    runs-on: ubuntu-latest
    # Runs already reach ~70 min with NVIDIA+JPMC listing under per-host
    # spacing; the W2 wave (~15k more postings) needs the headroom. The
    # `fetch` concurrency group keeps overlapping runs queued, not parallel.
    timeout-minutes: 110
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain). Tag shown for humans.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      # Secrets are scoped to the steps that need them, never job-wide.
      # One `sync --no-extract` runs collection in the CI-critical order: drain
      # the manifests a previous run archived but could not ingest (so the
      # watermark never advances past them), then fetch every board. Collection
      # is irreplaceable; nothing here may be downgraded or skipped.
      - name: sync
        # Must track the job timeout above, less teardown margin: at 45 the step
        # was axed one millisecond after printing a fully green envelope
        # (2026-09-06, run 34014403704) once 138 boards pushed past it.
        timeout-minutes: 100
        env:
          JOB_HUNTER_ARCHIVE_URL: ${{ vars.JOB_HUNTER_ARCHIVE_URL }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
        run: uv run job-hunter sync --no-extract | tee summary.json
      - name: status
        if: always()
        env:
          JOB_HUNTER_ARCHIVE_URL: ${{ vars.JOB_HUNTER_ARCHIVE_URL }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          JOB_HUNTER_DATABASE_URL: ${{ secrets.JOB_HUNTER_DATABASE_URL }}
        run: uv run job-hunter status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fetch-summary-${{ github.run_id }}
          path: summary.json
          retention-days: 30
          if-no-files-found: warn
      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling via the API resets that clock; first-party gh, no third-party action.
      # always(): a failing run is exactly when the keepalive must still fire — without
      # a status function GitHub ANDs in success(), so a red job would let the 60-day
      # idle rule silence the schedule that guards collection.
      - name: keepalive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable fetch.yml --repo "$GITHUB_REPOSITORY"
