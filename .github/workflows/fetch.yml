name: fetch
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_HUNTER_ARCHIVE_URL: ${{ vars.JOB_HUNTER_ARCHIVE_URL }}
      AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - name: fetch
        run: uv run job-hunter fetch --json | tee summary.json
      - name: status
        if: always()
        run: uv run job-hunter status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-summary-${{ github.run_id }}
          path: summary.json
          retention-days: 30
      # GitHub disables cron workflows after 60 days without repository activity.
      - uses: gautamkrishnar/keepalive-workflow@v2
        if: github.event_name == 'schedule'
