name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter
          POSTGRES_DB: jobhunter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobhunter -d jobhunter"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JOB_HUNTER_TEST_DATABASE_URL: postgresql://jobhunter:jobhunter@localhost:5432/jobhunter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: docker build
        run: docker build -t job-hunter:ci .
      - name: image smoke
        run: |
          docker run --rm job-hunter:ci job-hunter version
          # the MCP server ships in the same image and refuses to serve unguarded
          status=0
          docker run --rm -e JOB_HUNTER_ARCHIVE_URL=file:///archive \
            job-hunter:ci job-hunter-mcp || status=$?
          test "$status" -eq 3
