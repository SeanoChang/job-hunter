[project]
name = "job-hunter"
version = "0.1.0"
description = "job-hunter ingestion: ATS APIs -> R2 archive -> temporal store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "boto3>=1.35",
  "typer>=0.12",
]

[project.scripts]
job-hunter = "jobhunter.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "moto[s3]>=5",
  "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Retired parsing prototype, kept for reference only; not part of the package.
extend-exclude = ["prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jobhunter"]

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true
